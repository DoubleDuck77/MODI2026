<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MODI 2026 · Earth–Moon</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/main.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="toolbar">
    <h1 class="brand">MODI 2026 <span>Earth–Moon</span></h1>
    <a class="sim-link" href="/sim.html">Simulations →</a>
    <div class="controls">
      <button id="play-btn" type="button" aria-pressed="false">▶ Play</button>
      <label>UTC time <input id="time-input" type="datetime-local" step="3600"></label>
      <label>Speed
        <select id="speed-select">
          <option value="1">1 h/s</option>
          <option value="24">1 day/s</option>
          <option value="168">1 week/s</option>
          <option value="720">1 month/s</option>
        </select>
      </label>
      <label>View
        <select id="view-select">
          <option value="space">Space</option>
          <option value="surface">Lunar surface</option>
        </select>
      </label>
      <label>Lat <input id="lat-input" type="number" min="-90" max="90" step="0.1"></label>
      <label>Lon <input id="lon-input" type="number" min="-180" max="180" step="0.1"></label>
    </div>
    <input id="time-slider" type="range" aria-label="Timeline 2000–2100">
  </header>

  <main id="viewport" aria-label="3D scene"></main>

  <aside class="sidebar">
    <section>
      <h2>Layers</h2>
      <div id="layer-panel"></div>
    </section>
    <section>
      <h2>Contract inspector</h2>
      <div id="inspector"></div>
    </section>
  </aside>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
