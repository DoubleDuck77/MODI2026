<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MODI 2026 · Ziemia–Księżyc</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/main.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="toolbar">
    <h1 class="brand">MODI 2026 <span>Ziemia–Księżyc</span></h1>
    <div class="controls">
      <button id="play-btn" type="button" aria-pressed="false">▶ Play</button>
      <label>Czas UTC <input id="time-input" type="datetime-local" step="3600"></label>
      <label>Prędkość
        <select id="speed-select">
          <option value="1">1 h/s</option>
          <option value="24">1 dzień/s</option>
          <option value="168">1 tydzień/s</option>
          <option value="720">1 miesiąc/s</option>
        </select>
      </label>
      <label>Widok
        <select id="view-select">
          <option value="space">Kosmos</option>
          <option value="surface">Powierzchnia Księżyca</option>
        </select>
      </label>
      <label>Szer. <input id="lat-input" type="number" min="-90" max="90" step="0.1"></label>
      <label>Dł. <input id="lon-input" type="number" min="-180" max="180" step="0.1"></label>
    </div>
    <input id="time-slider" type="range" aria-label="Oś czasu 2000–2100">
  </header>

  <main id="viewport" aria-label="Scena 3D"></main>

  <aside class="sidebar">
    <section>
      <h2>Warstwy</h2>
      <div id="layer-panel"></div>
    </section>
    <section>
      <h2>Inspektor kontraktów</h2>
      <div id="inspector"></div>
    </section>
  </aside>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
