services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/srv/backend
      - ./contracts:/srv/contracts
      - ./frontend:/srv/frontend
      - ./Textures:/data/textures:ro
      - ./coords:/data/coords:ro
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir /srv/backend/app --reload-dir /srv/contracts
      --reload-include '*.json'
